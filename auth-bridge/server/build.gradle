plugins { id 'java'; id 'com.github.johnrengelman.shadow' version '8.1.1' }
java { toolchain.languageVersion = JavaLanguageVersion.of(17) }
repositories { mavenCentral(); maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' } }
dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.20.1-R0.1-SNAPSHOT'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}
test { useJUnitPlatform() }
shadowJar {
    archiveBaseName = 'SinsWorldAuth'
    archiveClassifier = ''
    relocate 'com.google.gson', 'world.sins.auth.shaded.gson'
    relocate 'org.bouncycastle', 'world.sins.auth.shaded.bc'
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
    // The Java 17 build uses BC base classes; omit optional Java 21 multi-release overlays.
    exclude 'META-INF/versions/**', 'module-info.class'
}
build.dependsOn shadowJar
