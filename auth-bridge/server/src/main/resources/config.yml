# Direct HTTPS on the allocated TCP port. No Website connection/domain required.
http-bind: '0.0.0.0'
http-port: 8765
tls-enabled: true
tls-ip: '104.204.218.124'
public-api-url: 'https://104.204.218.124:8765'
# For an existing HTTPS domain proxy instead: tls-enabled: false.
server-address: 'sinsworld.minecraft.best'
# Password registration has a minimum of 12. Existing AuthMe passwords may be shorter.
registration-min-password: 12
# The built-in AuthMe SQLite database is read ONLY to detect TOTP/password changes.
authme-database: 'plugins/AuthMe/authme.db'
authme-table: 'authme'
# Per observed source address. A Bloom proxy may share one address among users.
requests-per-minute: 120
failed-logins-per-account-per-minute: 10
registration-per-address-per-hour: 5
