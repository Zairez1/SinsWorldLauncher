<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Настройка авторизации</title><style>body{margin:0;background:#09120e;color:#e8f3ed;font:16px 'Segoe UI',sans-serif;padding:32px}h1{font-size:23px}p{color:#a0b6a8;line-height:1.5}input,button{box-sizing:border-box;width:100%;font:inherit;border-radius:7px;padding:13px;margin:8px 0}input{background:#101e17;color:white;border:1px solid #3c644d}button{background:#218d61;color:white;border:0;cursor:pointer}#result{white-space:pre-wrap}</style></head><body><h1>Подключение AuthMe</h1><p>Адрес игрового сервера: sinsworld.minecraft.best.<br>Введи HTTPS-адрес, созданный в Bloom Host для сервиса авторизации.</p><form id="form"><input id="url" type="url" placeholder="https://твой-поддомен" required><button id="save" disabled>Проверить и сохранить</button></form><p id="result" role="status"></p><script>window.addEventListener('pywebviewready',()=>document.getElementById('save').disabled=false);document.getElementById('form').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('save');b.disabled=true;try{const r=await pywebview.api.configure(document.getElementById('url').value);document.getElementById('result').textContent=r.ok?'Готово. Закрой это окно и запусти лаунчер.':r.error;}catch{document.getElementById('result').textContent='Не удалось сохранить настройки.';}finally{b.disabled=false;}};</script></body></html>
