name: Build SinsWorld AuthMe bridge
on:
  push:
    branches: [authme-arclight-bridge]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: auth-bridge-preview
  cancel-in-progress: true
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build plugin, client mod and security tests
        run: gradle -p auth-bridge --no-daemon :server:build :client:build
      - uses: actions/upload-artifact@v4
        with:
          name: AuthMe-bridge-components
          path: |
            auth-bridge/server/build/libs/SinsWorldAuth-1.0.0.jar
            auth-bridge/client/build/libs/sinsworld-auth-client-1.0.0.jar
            auth-bridge/server/build/reports/tests/test/**
