name: Build SinsWorld AuthMe bridge
on:
  push:
    branches: [authme-arclight-bridge]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: auth-bridge-preview
  cancel-in-progress: true
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build plugin, client mod and security tests
        run: gradle -p auth-bridge --no-daemon :server:build :client:build
      - uses: actions/upload-artifact@v4
        with:
          name: AuthMe-bridge-components
          path: |
            auth-bridge/server/build/libs/SinsWorldAuth-1.0.0.jar
            auth-bridge/client/build/libs/sinsworld-auth-client-1.0.0.jar
            auth-bridge/server/build/reports/tests/test/**
  windows:
    needs: java
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: AuthMe-bridge-components
          path: auth-components
      - name: Fetch pinned Naruto background
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download auth-bridge-current --repo $env:GITHUB_REPOSITORY --pattern naruto-scene.png --dir ui --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $digest = (Get-FileHash ui/naruto-scene.png -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne 'b84334e9838fc96be08a367e57dc2030551c0d72dea3391e644d1f31759bf842') { throw 'Naruto image hash mismatch' }
      - name: Fetch pinned Solo Leveling background
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download auth-bridge-current --repo $env:GITHUB_REPOSITORY --pattern solo-scene.png --dir ui --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $digest = (Get-FileHash ui/solo-scene.png -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne 'bae0b27482428a56856700f7ab996207ff8b2f0742a0539826db64ef885e1831') { throw 'Solo Leveling image hash mismatch' }
      - name: Fetch verified per-server music
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download auth-bridge-current --repo $env:GITHUB_REPOSITORY --pattern theme-music-v1.zip --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $digest = (Get-FileHash theme-music-v1.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne '956a1f064b73f00502290c7d0883b5fce537692dc82a9d93f88c46e7c6599f35') { throw 'Theme music archive hash mismatch' }
          Expand-Archive theme-music-v1.zip -DestinationPath ui -Force
          $manifest = Get-Content ui/theme-music-manifest.json -Raw | ConvertFrom-Json
          foreach ($entry in $manifest.PSObject.Properties) {
            if ((Get-FileHash (Join-Path ui $entry.Name) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $entry.Value) { throw 'Theme music file hash mismatch' }
          }
      - name: Pin the client mod built by the same run
        shell: pwsh
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          @'
          import json,hashlib,os
          from pathlib import Path
          client=next(Path('auth-components').rglob('sinsworld-auth-client-1.0.0.jar'))
          config=json.loads(Path('config.json').read_text('utf-8'))
          config['auth_bridge_client']={'repository':os.environ['REPOSITORY'],'release':'auth-bridge-current','asset':'sinsworld-auth-client-'+hashlib.sha256(client.read_bytes()).hexdigest()+'.jar','sha256':hashlib.sha256(client.read_bytes()).hexdigest(),'size':client.stat().st_size}
          Path('config.json').write_text(json.dumps(config,ensure_ascii=False,indent=2),encoding='utf-8')
          '@ | python
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Verify actual Windows EXE replacement, restart and backup
        run: python tools/test_windows_restart.py
      - name: Check deployed HTTPS health with bundled server certificate
        continue-on-error: true
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path
          from auth_bridge import check_api_url
          config=json.loads(Path('config.json').read_text('utf-8'))
          print(check_api_url(config['auth_api_url'],config['auth_tls_certificate']))
          print('PASS: deployed HTTPS identity and health verified; no account or game login performed')
          '@ | python
      - name: Build auth-capable Windows launcher
        run: python -m PyInstaller --noconfirm --clean SinsWorldLauncher.spec
      - name: Verify packaged auth module and create installable kit
        shell: pwsh
        run: |
          @'
          import json,subprocess,zipfile,shutil,hashlib
          from pathlib import Path
          exe=Path('dist/SinsWorldLauncher.exe').resolve()
          report=Path('dist/auth-build-result.json').resolve()
          result=subprocess.run([str(exe),'--verify-auth-build',str(report)],timeout=60)
          assert result.returncode==0 and json.loads(report.read_text())['ok']
          kit=Path('dist/kit')
          for sub in ('server/plugins/SinsWorldAuth','client','components'):(kit/sub).mkdir(parents=True,exist_ok=True)
          server=next(Path('auth-components').rglob('SinsWorldAuth-1.0.0.jar'))
          client=next(Path('auth-components').rglob('sinsworld-auth-client-1.0.0.jar'))
          shutil.copy2(server,kit/'server/plugins'/server.name)
          shutil.copy2('auth-bridge/server/src/main/resources/config.yml',kit/'server/plugins/SinsWorldAuth/config.yml')
          shutil.copy2(exe,kit/'client/SinsWorldLauncher-AuthMePreview.exe')
          shutil.copy2('auth-bridge/package/Configure-Auth.bat',kit/'client/Configure-Auth.bat')
          shutil.copy2(client,kit/'components'/client.name)
          shutil.copy2('auth-bridge/README_RU.md',kit/'README_RU.md')
          shutil.copytree('auth-bridge/network',kit/'network',dirs_exist_ok=True)
          (kit/'network/primary-certificate.pem').write_text(json.loads(Path('config.json').read_text('utf-8'))['auth_tls_certificate'],encoding='ascii')
          hashes={str(p.relative_to(kit)):hashlib.sha256(p.read_bytes()).hexdigest() for p in kit.rglob('*') if p.is_file()}
          (kit/'SHA256.json').write_text(json.dumps(hashes,indent=2))
          with zipfile.ZipFile('dist/SinsWorld-AuthMe-Arclight-Kit.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in kit.rglob('*'):
                  if p.is_file():z.write(p,p.relative_to(kit))
          shutil.copy2(server,Path('dist')/server.name)
          shutil.copy2(client,Path('dist')/client.name)
          pin=json.loads(Path('config.json').read_text('utf-8'))['auth_bridge_client']['asset']
          shutil.copy2(client,Path('dist')/pin)
          shutil.copy2(exe,'dist/SinsWorldLauncher-AuthMePreview.exe')
          shutil.copy2(exe,'dist/SinsWorldLauncher-1.2.8.exe')
          from version import VERSION
          from tools.make_release import file_entry
          manifest={'schema':1,'version':VERSION,'minimum_version':'1.2.5',**file_entry(exe)}
          Path('dist/launcher-manifest.json').write_text(json.dumps(manifest,indent=2),encoding='utf-8')
          shutil.copy2('auth-bridge/README_RU.md','dist/README_RU.md')
          print('PASS: packaged EXE contains auth bridge and pinned client; installation kit ready')
          '@ | python
      - uses: actions/upload-artifact@v4
        with:
          name: SinsWorld-AuthMe-Arclight-Kit
          path: dist/SinsWorld-AuthMe-Arclight-Kit.zip
      - name: Publish AuthMe launcher update channel (manifest last)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view auth-bridge-current --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create auth-bridge-current --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title 'SinsWorld AuthMe / Arclight — preview kit' --notes 'Install the server plugin and configure the real HTTPS endpoint before testing. Production launcher/mod channels are unchanged. See README_RU.md.'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release edit auth-bridge-current --repo $env:GITHUB_REPOSITORY --prerelease --title 'SinsWorld AuthMe — direct HTTPS by IP' --notes 'Launcher 1.2.8: unified primary/satellite accounts for Arclight/AuthMe servers; PNG, nickname and URL skin controls; profile head synchronized with SkinsRestorer. Server JAR update and network node configuration are required; future Naruto/Solo servers remain Coming soon. Includes per-server themes, loading screens and offline music from 1.2.7. Published to both update channels. Previews 1.2.0-1.2.3 without updater cannot be patched remotely. See network/README_RU.md in the kit.'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pinnedClient = python -c "import json; print(json.load(open('config.json'))['auth_bridge_client']['asset'])"
          gh release upload auth-bridge-current "dist/$pinnedClient" --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload auth-bridge-current dist/SinsWorld-AuthMe-Arclight-Kit.zip dist/SinsWorldLauncher-AuthMePreview.exe dist/SinsWorldLauncher-1.2.8.exe dist/SinsWorldAuth-1.0.0.jar dist/README_RU.md --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload auth-bridge-current dist/SinsWorldLauncher.exe --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload auth-bridge-current dist/launcher-manifest.json --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release view launcher-current --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) { throw 'Legacy launcher release does not exist' }
          gh release upload launcher-current dist/SinsWorldLauncher.exe --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload launcher-current dist/launcher-manifest.json --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
