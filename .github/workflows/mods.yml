name: Publish SinsWorld mods
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Public source folder for importing the existing modpack
        required: true
        default: https://disk.yandex.com/d/e7WQJL5LCRtWUA
  push:
    branches: [main]
    paths: ['mods/**']
  workflow_run:
    workflows: ['Build SinsWorld for Windows']
    types: [completed]
permissions:
  contents: write
concurrency:
  group: mods-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Skip automatic bootstrap when mods are already published
        id: bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_run ] && gh release view mods-current --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare actual mod files
        if: steps.bootstrap.outputs.skip != 'true'
        env:
          IMPORT_SOURCE: ${{ inputs.source_url || 'https://disk.yandex.com/d/e7WQJL5LCRtWUA' }}
        run: |
          mkdir -p release-mods
          if find mods -maxdepth 1 -name '*.jar' -print -quit 2>/dev/null | grep -q .; then
            cp mods/*.jar release-mods/
          else
            python tools/import_yandex_mods.py --source "$IMPORT_SOURCE" --output release-mods
          fi
          python tools/make_release.py mods --folder release-mods --output mods-manifest.json
      - name: Publish checked assets, manifest last
        if: steps.bootstrap.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view mods-current --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create mods-current --repo "$GITHUB_REPOSITORY" --title 'SinsWorld Modpack' --notes 'Forge 1.20.1 mod update channel'
          for mod in release-mods/*.jar; do
            gh release upload mods-current "$mod" --clobber --repo "$GITHUB_REPOSITORY"
          done
          gh release upload mods-current mods-manifest.json --clobber --repo "$GITHUB_REPOSITORY"
